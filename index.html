<head>

<title>БОРТ — Управление техникой, сменами и ремонтами</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
:root, [data-theme="dark"] {
  --bg:#090A0C; --s1:#111317; --s2:#16191F; --s3:#1D212A;
  --bd:rgba(255,255,255,.075); --bd2:rgba(255,255,255,.14);
  --tx:#F2F4F7; --tx2:#B4BCC8; --mu:#7B8494; --mu2:#4C535F;
  --ac:#D8F33B; --ac-tx:#0B0D0E; --ac-s:rgba(216,243,59,.11);
  --gr:#22C55E; --gr-s:rgba(34,197,94,.12);
  --yl:#EAB308; --yl-s:rgba(234,179,8,.13);
  --rd:#F05252; --rd-s:rgba(240,82,82,.13);
  --bl:#60A5FA; --bl-s:rgba(96,165,250,.12);
  --glass:rgba(17,19,23,.86); --scrim:rgba(0,0,0,.74);
  --shadow:0 14px 36px rgba(0,0,0,.48);
}
[data-theme="light"] {
  --bg:#F2F4F7; --s1:#FFFFFF; --s2:#F7F8FA; --s3:#E8ECF2;
  --bd:rgba(15,23,42,.08); --bd2:rgba(15,23,42,.16);
  --tx:#0F172A; --tx2:#334155; --mu:#64748B; --mu2:#94A3B8;
  --ac:#111317; --ac-tx:#D8F33B; --ac-s:rgba(17,19,23,.07);
  --gr:#15803D; --gr-s:rgba(21,128,61,.1);
  --yl:#B45309; --yl-s:rgba(180,83,9,.11);
  --rd:#DC2626; --rd-s:rgba(220,38,38,.1);
  --bl:#2563EB; --bl-s:rgba(37,99,235,.1);
  --glass:rgba(255,255,255,.9); --scrim:rgba(15,23,42,.45);
  --shadow:0 8px 24px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",sans-serif;font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
svg.ico{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center;flex:none}
.logo-name{font-size:17px;font-weight:800;letter-spacing:.14em;line-height:1}
.logo-sub{font-size:10.5px;color:var(--mu);margin-top:3px;display:flex;align-items:center;gap:5px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mu2);padding:12px 10px 5px}
.nav button{height:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left;transition:all .14s}
.nav button:hover{color:var(--tx);background:var(--s2)}
.nav button.on{color:var(--tx);background:var(--s2);border-color:var(--bd2)}
.nav button.on svg.ico{color:var(--ac)}
[data-theme="light"] .nav button.on svg.ico{color:var(--tx)}
.nav .badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--s3);color:var(--tx2)}
.nav .badge.rd{background:var(--rd-s);color:var(--rd)}
.nav .badge.yl{background:var(--yl-s);color:var(--yl)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--bd)}
.role-card{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .14s}
.role-card:hover{border-color:var(--ac)}
.role-card b{font-size:12.5px;display:block}
.role-card small{font-size:10.5px;color:var(--mu)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:54px;padding:0 18px;border-bottom:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:450}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.mob-brand{display:none;align-items:center;gap:7px}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:7px;flex:none}
.btn{height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .14s;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.ac{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);font-weight:700}
.btn.rd{background:var(--rd-s);color:var(--rd);border-color:rgba(240,82,82,.35)}
.btn.gr{background:var(--gr-s);color:var(--gr);border-color:rgba(34,197,94,.35)}
.btn.lg{height:44px;padding:0 16px;font-size:13.5px;border-radius:10px}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px;border-radius:7px}
.content{padding:15px 18px 34px;display:flex;flex-direction:column;gap:13px;min-width:0}
.ctrl-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg3{display:inline-flex;gap:3px;background:var(--s1);border:1px solid var(--bd);padding:3px;border-radius:9px}
.seg3 button{height:28px;padding:0 10px;border:none;border-radius:6px;background:transparent;color:var(--mu);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.seg3 button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:10px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0}
.kpi.hi{background:var(--ac);color:var(--ac-tx);border-color:transparent}
.kpi-l{font-size:11px;font-weight:600;color:var(--mu);display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.kpi.hi .kpi-l{color:rgba(11,13,14,.72)}
[data-theme="light"] .kpi.hi .kpi-l{color:rgba(216,243,59,.8)}
.kpi-v{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.08;white-space:nowrap}
.kpi-s{font-size:11.5px;color:var(--mu);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi.hi .kpi-s{color:rgba(11,13,14,.82);font-weight:600}
[data-theme="light"] .kpi.hi .kpi-s{color:rgba(255,255,255,.78)}
.split{display:grid;grid-template-columns:308px minmax(0,1fr);gap:12px;align-items:start}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.panel-h{padding:11px 13px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.panel-ht{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-ht h2{font-size:13.5px;font-weight:700;white-space:nowrap}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--mu);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.dot.gr{background:var(--gr)} .dot.yl{background:var(--yl)} .dot.rd{background:var(--rd)} .dot.bl{background:var(--bl)}
.fleet-list{display:flex;flex-direction:column;max-height:770px;overflow-y:auto}
.f-item{flex:0 0 auto;padding:11px 13px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .12s;display:flex;flex-direction:column;gap:5px;position:relative}
.f-item:last-child{border-bottom:none}
.f-item:hover{background:var(--s2)}
.f-item.active{background:var(--s2)}
.f-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--ac)}
[data-theme="light"] .f-item.active::before{background:var(--tx)}
.fi-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fi-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-plate{font-size:10.5px;color:var(--mu);background:var(--s3);padding:1px 6px;border-radius:4px;white-space:nowrap;flex:none}
.fi-sub{font-size:11px;color:var(--mu);display:flex;justify-content:space-between;gap:6px}
.fi-bot{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px}
.fi-metrics{color:var(--tx2);display:flex;gap:8px;white-space:nowrap}
.fi-alert{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.fi-alert.rd{background:var(--rd-s);color:var(--rd)} .fi-alert.yl{background:var(--yl-s);color:var(--yl)} .fi-alert.bl{background:var(--bl-s);color:var(--bl)}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.map-wrap{position:relative;height:285px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#0C0F14;z-index:1}
#live-map{width:100%;height:100%;background:#0C0F14;z-index:1}
.leaflet-container{background:#0C0F14 !important;font-family:inherit !important;z-index:1 !important}
.leaflet-pane,.leaflet-top,.leaflet-bottom{z-index:5 !important}
.leaflet-control-attribution{background:rgba(9,10,12,.72) !important;color:#525A66 !important;font-size:9px !important}
.map-hud{position:absolute;top:10px;left:10px;right:10px;z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd2);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:fit-content;max-width:calc(100% - 20px)}
.hud-kv{min-width:0}
.hud-kv span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.hud-kv b{font-size:12px;font-weight:700;white-space:nowrap}
.hud-sep{width:1px;height:22px;background:var(--bd2);flex:none}
.map-legend{position:absolute;bottom:10px;left:10px;z-index:20;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;display:flex;gap:10px;font-size:11px;color:var(--tx2)}
.map-legend span{display:inline-flex;align-items:center;gap:4px}
.bort-pin{display:flex;align-items:center;justify-content:center;padding:3px 7px;border-radius:6px;background:#111317;border:1.5px solid #22C55E;color:#F2F4F7;font-size:11px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.65);white-space:nowrap}
.bort-pin.active{background:#D8F33B;color:#0B0D0E;border-color:#D8F33B;transform:scale(1.12)}
.bort-pin.rd{border-color:#F05252} .bort-pin.yl{border-color:#EAB308}
.passport{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.pass-h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pass-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pass-title h3{font-size:15.5px;font-weight:700}
.status-chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.status-chip.gr{background:var(--gr-s);color:var(--gr)} .status-chip.yl{background:var(--yl-s);color:var(--yl)} .status-chip.rd{background:var(--rd-s);color:var(--rd)} .status-chip.bl{background:var(--bl-s);color:var(--bl)}
.pass-top-band{display:grid;grid-template-columns:1.15fr 1fr;border-bottom:1px solid var(--bd)}
.pass-grid{display:grid;grid-template-columns:1fr 1fr}
.pass-col{padding:14px 16px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:10px;min-width:0}
.pass-col:last-child{border-right:none}
.col-lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;justify-content:space-between;gap:8px}
.cad-stage{background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.03),transparent 70%),var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px 9px}
.cad-tags{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:4px}
.cad-svg{width:100%;height:90px;display:block}
.gauge-box{display:flex;flex-direction:column;gap:6px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;gap:6px}
.gauge-bar{height:10px;border-radius:4px;background:var(--s3);border:1px solid var(--bd);overflow:hidden;display:flex}
.gauge-fill{height:100%;background:var(--tx)} .gauge-fill.low{background:var(--yl)}
.gauge-loss{height:100%;background:repeating-linear-gradient(-45deg,var(--rd),var(--rd) 3px,rgba(240,82,82,.35) 3px,rgba(240,82,82,.35) 6px);border-left:1px solid #fff}
.gauge-ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--mu2)}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.m3-box{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 9px}
.m3-box span{display:block;font-size:10.5px;color:var(--mu)}
.m3-box b{font-size:15px;font-weight:700;display:block;margin-top:2px;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--s2);border:1px solid var(--bd);padding:3px;border-radius:8px}
.seg button{height:28px;border:none;border-radius:6px;background:transparent;color:var(--mu);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.shift-bar{height:7px;border-radius:3px;background:var(--s3);display:flex;overflow:hidden;gap:2px}
.sb-w{background:var(--gr)} .sb-i{background:var(--yl)} .sb-d{background:var(--rd)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flbl{display:block;font-size:10.5px;color:var(--mu);font-weight:600;margin-bottom:4px}
.inp,.sel{width:100%;height:36px;border-radius:8px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);padding:0 10px;font-size:13px;font-weight:600;font-family:inherit}
.inp:focus,.sel:focus{outline:none;border-color:var(--ac)}
.kv-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12.5px;gap:8px}
.kv-row:last-child{border-bottom:none}
.kv-row.tot{border-top:1px solid var(--bd2);border-bottom:none;padding-top:8px;margin-top:2px;font-size:14px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:11px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700}
.rt-item{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 15px;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;gap:10px}
.rt-item:hover{border-color:var(--bd2);background:var(--s2)}
.rt-rate{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--ac-s);color:var(--ac);border:1px solid rgba(216,243,59,.25);white-space:nowrap}
[data-theme="light"] .rt-rate{background:var(--tx);color:#D8F33B;border-color:transparent}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;font-weight:600;color:var(--mu);text-align:left;padding:8px 9px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{font-size:12.5px;padding:9px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl tr:hover td{background:var(--s2)}
.tbl th.r,.tbl td.r{text-align:right}
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cap-btn{min-height:78px;border-radius:12px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);padding:11px 10px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;transition:all .14s}
.cap-btn:hover{border-color:var(--ac);background:var(--s3)}
.cap-btn.hi{background:var(--ac);color:var(--ac-tx);border-color:transparent}
.cap-btn b{font-size:13px;line-height:1.2}
.cap-btn span{font-size:11px;opacity:.75}
.feed-item{background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start}
.feed-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--s3);border:1px solid var(--bd2);flex:none;display:grid;place-items:center;font-size:11px;color:var(--mu);font-weight:700}
.mech-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:11px}
.mech-card.red{border-color:rgba(240,82,82,.45)} .mech-card.yel{border-color:rgba(234,179,8,.4)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:600;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;width:480px;max-width:calc(100vw - 20px);max-height:88vh;overflow-y:auto;z-index:610;background:var(--s1);border:1px solid var(--bd2);border-radius:16px;padding:18px;box-shadow:var(--shadow);transition:all .18s}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.mob-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(5,1fr);gap:3px}
.mob-nav button{min-height:48px;border:none;border-radius:9px;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit}
.mob-nav button.on{color:var(--ac);background:var(--ac-s)}

          <div class="fleet-list">${list.map(({ m: car, c: cc }) => `<div class="f-item ${car.id===SEL_ID?'active':''}" onclick="selectCar('${car.id}')"><div class="fi-top"><div class="fi-name"><span class="dot ${car.level}"></span>${esc(car.name)}</div><span class="fi-plate mono">${esc(car.plate)}</span></div><div class="fi-sub"><span>${esc(curDriver(car))} · ${esc(cc.rt.name.split('→')[0].trim())}</span><span class="mono">${car.tankNow} л</span></div><div class="fi-bot num">${car.level !== 'gr' ? `<span class="fi-alert ${car.level}">${esc(car.status)}</span>` : `<div class="fi-metrics">${cc.isExc?`<span>${f(car.workH,1)} м/ч</span>`:`<span>${car.trips} р.</span><span>${f(cc.dayTons)} т</span><span>${f(car.dayKm)} км</span>`}</div>`}${isBoss() ? `<b style="color:${cc.dayProfit>=0?'var(--gr)':'var(--rd)'}">${cc.dayProfit>=0?'+':'−'}${f(Math.abs(cc.dayProfit))} ₽</b>` : `<span class="mono" style="color:var(--mu)">${f(car.mh)} м/ч</span>`}</div></div>`).join('')}</div>

            <div class="map-legend"><span><span class="dot gr"></span>Работа</span><span><span class="dot yl"></span>ТО/Хол.</span><span><span class="dot rd"></span>Слив/Рем.</span></div>

          </div>
          ${passportHtml(m, false)}
        </div>
      </div>`;
    if (!isMob()) setTimeout(initMap, 15);
  } else if (TAB === 'routes') {

      <div class="card"><div class="card-h"><h3>Ремзона сейчас (${inRep.length})</h3><span style="font-size:12px;color:var(--mu)">Крупные кнопки под грязные пальцы</span></div>${inRep.length ? `<div class="grid2">${inRep.map(m => `<div class="mech-card red"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>${esc(m.name)}</b> <span class="fi-plate mono">${esc(m.plate)}</span><div style="font-size:12px;color:var(--mu);margin-top:3px">Водитель: ${esc(m.drvDay)} · ${f(m.odoKm)} км · ${f(m.mh)} м/ч</div></div><span class="status-chip rd">${m.techState==='parts'?'Ждёт запчасть':'В работе'}</span></div><div style="font-size:12.5px;color:var(--tx2);background:var(--s2);padding:8px 10px;border-radius:8px">${esc(m.partWait || m.status)}</div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn gr lg" style="flex:1" onclick="setTechState('${m.id}','ok')">✓ Выпустить на линию</button><button class="btn lg" onclick="setTechState('${m.id}','${m.techState==='parts'?'repair':'parts'}')">${m.techState==='parts'?'Запчасть пришла':'Ждём деталь'}</button></div></div>`).join('')}</div>` : `<div style="color:var(--gr);font-weight:600">Все борта исправны и допущены на линию.</div>`}</div>
      <div class="card"><div class="card-h"><h3>Регламент ТО (что раньше: км или моточасы м/ч)</h3></div><div class="grid2">${all.slice().sort((a,b) => Math.min(a.c.toLeftMh*50, a.c.toLeftKm) - Math.min(b.c.toLeftMh*50, b.c.toLeftKm)).map(({ m, c }) => { const col = c.toOver ? 'var(--rd)' : (c.toUrgent ? 'var(--yl)' : 'var(--gr)'), pct = Math.min(100, Math.max(10, Math.round((300 - c.toLeftMh) / 300 * 100))); return `<div class="mech-card ${c.toOver?'red':(c.toUrgent?'yel':'')}" style="padding:12px 13px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(m.name)}</b><b class="mono" style="font-size:12px;color:${col}">${c.toLeftMh<=0?`+${Math.abs(c.toLeftMh)} м/ч проср.`:`через ${c.toLeftMh} м/ч`}</b></div><div class="mono" style="font-size:11px;color:var(--mu)">${m.nextToKm?`Пробег ${f(m.odoKm)} / ${f(m.nextToKm)} км · `:''}Моточасы ${f(m.mh)} / ${f(m.nextToMh)}</div><div style="height:5px;border-radius:3px;background:var(--s3);overflow:hidden"><div style="height:100%;width:${pct}%;background:${col}"></div></div><div style="display:flex;gap:6px"><button class="btn sm" onclick="openAddMaint('${m.id}')">Записать ТО</button>${m.techState==='ok'?`<button class="btn sm rd" onclick="setTechState('${m.id}','repair')">В ремонт</button>`:''}</div></div>`; }).join('')}</div></div>
      <div class="card"><div class="card-h"><h3>История ремонтов и замен (удаление заблокировано)</h3><select class="sel" style="width:auto;min-width:180px" onchange="TO_FILT=this.value;render()"><option value="all" ${TO_FILT==='all'?'selected':''}>Все борта</option>${STATE.machines.map(m => `<option value="${m.id}" ${TO_FILT===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Дата</th><th>Борт</th><th class="r">Пробег / м/ч</th><th>Тип</th><th>Работы / узел</th>${isBoss()?'<th class="r">Сумма</th>':''}<th>Кто внёс</th></tr></thead><tbody class="num">${logs.map(l => { const car = STATE.machines.find(x => x.id === l.machineId) || { name:'№'+l.machineId }; return `<tr><td class="mono">${fmtD(l.date)}</td><td><b>${esc(car.name)}</b></td><td class="r mono">${f(l.odoKm)} км · ${f(l.mh||0)} м/ч</td><td><span class="status-chip ${l.type==='to'?'gr':'yl'}">${l.type==='to'?'ТО':'Ремонт'}</span></td><td style="white-space:normal;min-width:200px">${esc(l.work)}${l.photo?` <span class="fi-plate">📎 фото</span>`:''}</td>${isBoss()?`<td class="r"><b>${l.cost?f(l.cost)+' ₽':'—'}</b></td>`:''}<td style="color:var(--mu);font-size:11.5px">${esc(l.author||'Механик')}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  } else if (TAB === 'feed') {
    const chNames = { bort:'Внутри БОРТ (без VPN)', max:'MAX-бот (РФ без VPN)', vk:'VK Мессенджер', tg:'Telegram-бот' };
    root.innerHTML = `<div class="card"><div class="card-h"><div><h3>Быстрая отправка с телефона (1 тап, без VPN)</h3><div style="font-size:12px;color:var(--mu)">Канал уведомлений: <b style="color:var(--ac)">${chNames[STATE.notifyChannel]}</b></div></div><button class="btn sm" onclick="openSettingsModal()">Сменить канал</button></div><div class="cap-grid"><button class="cap-btn hi" onclick="openCaptureModal('odo')"><b>📷 Заступил на смену</b><span>Сфоткал одометр → пробег сам в базе</span></button><button class="cap-btn" onclick="openCaptureModal('scale')"><b>📷 Накладная с весовой</b><span>Сфоткал талон → тоннаж сам в рейсах</span></button><button class="cap-btn" onclick="openCaptureModal('defect')"><b>📷 Поломка / чек запчасти</b><span>Сфоткал узел → ушло директору и в ТО</span></button></div></div><div class="card"><div class="card-h"><h3>Живая лента смены (${STATE.feed.length})</h3><span style="font-size:12px;color:var(--mu)">Все фото, заступления, весовая и тревоги</span></div><div style="display:flex;flex-direction:column;gap:8px">${STATE.feed.map(it => `<div class="feed-item">${it.img ? `<img class="feed-thumb" src="${it.img}" />` : `<div class="feed-thumb">${esc(it.tag)}</div>`}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><div><span class="status-chip ${it.badge}" style="margin-right:6px">${esc(it.tag)}</span><b>${esc(it.who)}</b></div><span class="mono" style="font-size:11px;color:var(--mu)">${esc(it.time)}</span></div><div style="font-size:12.5px;color:var(--tx2);margin-top:4px">${esc(it.text)}</div></div></div>`).join('')}</div></div>`;

render();
