function parseMechCsv(text) {
  const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) return 0;
  const sep = lines[0].includes(';') ? ';' : ',';
  let updated = 0;
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
    if (cols.length < 4) continue;
    const [rtName, rtRateStr, carId, drv, capStr] = cols;
    let rt = STATE.routes.find(r => r.name.toLowerCase() === rtName.toLowerCase());
    if (!rt && rtName) { rt = { id:'r'+Date.now()+i, name:rtName, mode:'ton', rate:Number(rtRateStr)||200, legKm:16, path:[[54.45,86.25],[54.50,86.40]] }; STATE.routes.push(rt); }
    else if (rt && Number(rtRateStr) > 0) rt.rate = Number(rtRateStr);
    const car = STATE.machines.find(m => m.id === carId || m.name.toLowerCase().includes(carId.toLowerCase()));
    if (car && rt) { car.routeId = rt.id; if (drv) car.driver = drv; if (Number(capStr) > 0) car.capTon = Number(capStr); updated++; }
  }
  if (updated > 0) { saveState(); render(); }
  return updated;
}

  } catch (e) { toast('Не удалось прочитать ссылку — проверь публикацию CSV'); }
}
function importLocalCsv(inp) {

function getRoute(id) { return STATE.routes.find(r => r.id === id) || STATE.routes[0] || { id:'none', name:'Без маршрута', mode:'ton', rate:0, legKm:0 }; }
function calc(m) {
  const rt = getRoute(m.routeId);
  const tons = m.tonMode === 'manual' ? Number(m.manualTons || 0) : Math.round(Number(m.trips || 0) * Number(m.capTon || 0));
  const tonsSrc = m.tonMode === 'manual' ? 'весовая' : `${m.trips} × ${m.capTon} т`;
  const rev = rt.mode === 'ton' ? tons * rt.rate : (rt.mode === 'trip' ? m.trips * rt.rate : m.dayKm * rt.rate);
  const rateLbl = rt.mode === 'ton' ? `${f(rt.rate)} ₽/т` : (rt.mode === 'trip' ? `${f(rt.rate)} ₽/рейс` : `${f(rt.rate)} ₽/км`);
  const totalFuelL = Number(m.burnedL || 0) + Number(m.slivL || 0);
  const fuelRub = totalFuelL * STATE.diesel, slivRub = Number(m.slivL || 0) * STATE.diesel;
  const todayRep = STATE.maint.filter(x => x.machineId === m.id && x.today).reduce((s, x) => s + Number(x.cost || 0), 0);
  const profit = rev - fuelRub - Number(m.wage || 0) - Number(m.fix || 0) - todayRep;
  const tankPct = Math.min(100, Math.max(0, Math.round(m.tankNow / (m.tankCap || 1) * 100)));

  const toLeft = Number(m.nextToKm || 0) - Number(m.odoKm || 0);
  return { rt, tons, tonsSrc, rev, rateLbl, totalFuelL, fuelRub, slivRub, todayRep, profit, tankPct, slivPct, toLeft };
}

                  ${logs[0] ? `<div style="font-size:12px;color:var(--tx2);margin-top:7px;padding-top:7px;border-top:1px solid var(--bd)"><span class="mono" style="color:var(--mu)">${fmtD(logs[0].date)} · ${f(logs[0].odoKm)} км</span><br/>${esc(logs[0].work)} ${logs[0].cost?`<b>(${f(logs[0].cost)} ₽)</b>`:''}</div>` : ''}

                ${MECH_MODE ? `<div style="margin-top:auto;font-size:12px;color:var(--mu);padding:10px 12px;border-radius:9px;background:var(--s2);border:1px solid var(--bd)">Финансовые показатели скрыты в режиме механика. Доступно: направления, водители, тоннаж и журнал ТО.</div>` : `<div class="num" style="margin-top:auto">
                  <div class="kv-row"><span style="color:var(--mu)">Выручка (${c.rt.mode==='ton'?`${f(c.tons)} т`:`${m.trips} р.`})</span><b style="color:var(--gr)">+${f(c.rev)} ₽</b></div>
                  <div class="kv-row"><span style="color:var(--mu)">Топливо (${c.totalFuelL} л × ${STATE.diesel} ₽)</span><span>−${f(c.fuelRub)} ₽</span></div>

                </div>`}
              </div>
            </div>
          </div>
        </div>
      </div>`;
    setTimeout(initMap, 10);
  } else if (TAB === 'routes') {
    if (OPEN_ROUTE_ID) {
      const r = getRoute(OPEN_ROUTE_ID), onR = STATE.machines.filter(m => m.routeId === r.id), offR = STATE.machines.filter(m => m.routeId !== r.id);
      const rTons = onR.reduce((s, m) => s + calc(m).tons, 0), rRev = onR.reduce((s, m) => s + calc(m).rev, 0);

        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><button class="btn" onclick="OPEN_ROUTE_ID=null;render()">← Ко всем маршрутам</button><button class="btn rd" onclick="delRoute('${r.id}')">Удалить маршрут</button></div>

          <div class="card">
            <div class="card-h"><h3>Параметры маршрута</h3><span class="mono" style="color:var(--ac)">${f(rTons)} т · +${f(rRev)} ₽</span></div>

            <div><label class="flbl">Длина плеча (км на рейс)</label><input type="number" class="inp num" value="${r.legKm}" onchange="updRoute('${r.id}','legKm',+this.value||10)" /></div>

          <div class="card">

            ${offR.length ? `<div style="display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--bd)"><div class="f2"><div><label class="flbl">Борт из парка</label><select class="sel" id="as-car" onchange="syncAssignDrv()">${offR.map(m => `<option value="${m.id}">${esc(m.name)} (${esc(m.plate)})</option>`).join('')}</select></div><div><label class="flbl">Фамилия водителя</label><input class="inp" id="as-drv" value="${esc(offR[0].driver)}" /></div></div><button class="btn ac" onclick="assignCar('${r.id}')">Поставить на этот маршрут</button></div>` : ''}
            <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:12px;font-weight:700;color:var(--mu)">Или завести новый борт</div><div class="f2"><input class="inp" id="nc-name" placeholder="Марка и номер (SHACMAN №21)" /><input class="inp" id="nc-plate" placeholder="Госномер (Е 555 КХ 42)" /><input class="inp" id="nc-drv" placeholder="Фамилия водителя" /><input type="number" class="inp num" id="nc-cap" value="25" placeholder="Кузов, т" /></div><button class="btn" onclick="createCarOnRoute('${r.id}')">+ Создать борт и добавить сюда</button></div>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Борта и водители на этом маршруте (${onR.length})</h3><span style="font-size:12px;color:var(--mu)">Изменения сразу пересчитывают пульт</span></div>
          ${onR.length ? `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Борт</th><th>Госномер</th><th>Водитель на маршруте</th><th class="r">Кузов, т</th><th class="r">Рейсы</th><th class="r">Тоннаж</th><th class="r">Выручка</th></tr></thead><tbody class="num">${onR.map(m => { const cc = calc(m); return `<tr><td><b>${esc(m.name)}</b></td><td class="mono" style="color:var(--mu)">${esc(m.plate)}</td><td><input class="inp" style="height:28px;min-width:130px" value="${esc(m.driver)}" onchange="updCar('${m.id}','driver',this.value)" /></td><td class="r"><input type="number" class="inp num" style="height:28px;width:66px;text-align:right" value="${m.capTon}" onchange="updCar('${m.id}','capTon',+this.value||25)" /></td><td class="r">${m.trips}</td><td class="r"><b>${f(cc.tons)} т</b></td><td class="r" style="color:var(--gr);font-weight:700">+${f(cc.rev)} ₽</td></tr>`; }).join('')}</tbody></table></div>` : `<div style="color:var(--mu)">На этот маршрут ещё не назначены машины.</div>`}
        </div>`;
    } else {
      root.innerHTML = `
        <div class="card-h"><div><h3>Направления и маршруты (${STATE.routes.length})</h3><div style="font-size:12px;color:var(--mu);margin-top:2px">Нажми на любой маршрут — внутри смена названия, цены, машин и водителей</div></div><div style="display:flex;gap:8px"><button class="btn lg" onclick="openCloudModal()">Облако / Excel</button><button class="btn ac lg" onclick="addNewRoute()">+ Добавить маршрут</button></div></div>
        <div class="grid2">${STATE.routes.map((r, i) => { const cars = STATE.machines.filter(m => m.routeId === r.id), rTons = cars.reduce((s, m) => s + calc(m).tons, 0), rRev = cars.reduce((s, m) => s + calc(m).rev, 0), rl = r.mode==='ton'?`${f(r.rate)} ₽/т`:(r.mode==='trip'?`${f(r.rate)} ₽/рейс`:`${f(r.rate)} ₽/км`); return `<div class="rt-item" onclick="OPEN_ROUTE_ID='${r.id}';render()"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="mono" style="font-size:10.5px;color:var(--mu);text-transform:uppercase">Маршрут 0${i+1} · плечо ${r.legKm} км</div><div style="font-size:15px;font-weight:700;margin-top:3px">${esc(r.name)}</div></div><div class="rt-rate mono">${rl}</div></div><div style="display:flex;gap:14px;font-size:12px;color:var(--mu)" class="num"><span>Бортов: <b style="color:var(--tx)">${cars.length}</b></span><span>Вывезено: <b style="color:var(--tx)">${f(rTons)} т</b></span><span>Выручка: <b style="color:var(--gr)">+${f(rRev)} ₽</b></span></div><div style="display:flex;gap:5px;flex-wrap:wrap">${cars.map(m => `<span class="fi-plate">${esc(m.name.split(' ')[0])} №${m.id} · ${esc(m.driver)}</span>`).join('')}</div></div>`; }).join('')}</div>`;
    }
  } else if (TAB === 'to') {
    const mCost = STATE.maint.reduce((s, x) => s + Number(x.cost || 0), 0), logs = TO_FILT === 'all' ? STATE.maint : STATE.maint.filter(x => x.machineId === TO_FILT);
    root.innerHTML = `
      <div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="kpi-l"><span>Требуют ТО (&lt;1 500 км)</span></div><div class="kpi-v num" style="color:var(--yl)">${toCnt} борта</div><div class="kpi-s">по пробегу Gelios</div></div><div class="kpi"><div class="kpi-l"><span>На рембазе сейчас</span></div><div class="kpi-v num" style="color:var(--rd)">${STATE.machines.filter(m=>m.level==='rd').length} борта</div><div class="kpi-s">рессора, турбина</div></div><div class="kpi"><div class="kpi-l"><span>Затраты на ТО и ремонт</span></div><div class="kpi-v num">${f(mCost)} ₽</div><div class="kpi-s">по журналу работ</div></div></div>
      <div class="card"><div class="card-h"><h3>Регламент плановых ТО</h3><button class="btn ac" onclick="openAddMaint()">+ Записать ТО / ремонт</button></div><div class="grid2">${all.slice().sort((a,b) => a.c.toLeft - b.c.toLeft).map(({ m, c }) => { const pct = Math.min(100, Math.max(8, Math.round((15000 - c.toLeft) / 15000 * 100))), col = c.toLeft <= 0 ? 'var(--rd)' : (c.toLeft <= 1500 ? 'var(--yl)' : 'var(--gr)'); return `<div style="background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;cursor:pointer" onclick="SEL_ID='${m.id}';go('home')"><div style="display:flex;justify-content:space-between;font-size:12.5px"><b>${esc(m.name)}</b><b class="mono" style="color:${col}">${c.toLeft<=0?`+${f(Math.abs(c.toLeft))} км просрочка`:`через ${f(c.toLeft)} км`}</b></div><div class="mono" style="font-size:11px;color:var(--mu);margin-top:3px">Одометр ${f(m.odoKm)} км · план ТО на ${f(m.nextToKm)} км</div><div style="height:4px;border-radius:2px;background:var(--s3);margin-top:8px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col}"></div></div></div>`; }).join('')}</div></div>
      <div class="card"><div class="card-h"><h3>Журнал ремонтов и замен (${logs.length})</h3><select class="sel" style="width:auto;min-width:190px" onchange="TO_FILT=this.value;render()"><option value="all" ${TO_FILT==='all'?'selected':''}>Все борта</option>${STATE.machines.map(m => `<option value="${m.id}" ${TO_FILT===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Дата</th><th>Борт</th><th class="r">Пробег</th><th>Тип</th><th>Выполненные работы / замена</th><th class="r">Сумма</th><th></th></tr></thead><tbody class="num">${logs.map(l => { const car = STATE.machines.find(x => x.id === l.machineId) || { name:'№'+l.machineId }; return `<tr><td class="mono">${fmtD(l.date)}</td><td><b>${esc(car.name)}</b></td><td class="r mono">${f(l.odoKm)} км</td><td><span class="status-chip ${l.type==='to'?'gr':'yl'}">${l.type==='to'?'ТО':'Ремонт'}</span></td><td style="white-space:normal;min-width:220px">${esc(l.work)}</td><td class="r"><b>${l.cost?f(l.cost)+' ₽':'—'}</b></td><td class="r"><button class="btn" style="height:26px;font-size:11px" onclick="delMaint('${l.id}')">✕</button></td></tr>`; }).join('')}</tbody></table></div></div>`;
  } else if (TAB === 'fin') {
    root.innerHTML = `<div class="card"><div class="card-h"><div><h3>Экономика по каждому борту · сутки</h3><div style="font-size:12px;color:var(--mu)">Дизель ${STATE.diesel} ₽/л · нажми на строку, чтобы открыть борт на пульте</div></div><button class="btn" onclick="exportCsv()">Выгрузить Excel</button></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Борт</th><th>Маршрут</th><th class="r">Рейсы</th><th class="r">Тоннаж</th><th class="r">Пробег</th><th class="r">ДТ, л</th><th class="r">Выручка</th><th class="r">Расходы</th><th class="r">Чистыми</th></tr></thead><tbody class="num">${all.map(({ m, c }) => `<tr style="cursor:pointer" onclick="SEL_ID='${m.id}';go('home')"><td><b>${esc(m.name)}</b> <span style="color:var(--mu);font-size:11px">${esc(m.driver)}</span></td><td style="color:var(--tx2)">${esc(c.rt.name)}</td><td class="r">${m.trips}</td><td class="r"><b>${f(c.tons)} т</b> <span style="font-size:10.5px;color:var(--mu)">(${c.tonsSrc})</span></td><td class="r">${f(m.dayKm)} км</td><td class="r" style="color:${m.slivL?'var(--rd)':'var(--tx)'}">${c.totalFuelL}${m.slivL?` (−${m.slivL})`:''}</td><td class="r">${f(c.rev)} ₽</td><td class="r" style="color:var(--mu)">−${f(c.rev - c.profit)} ₽</td><td class="r" style="font-weight:700;color:${c.profit>=0?'var(--gr)':'var(--rd)'}">${c.profit>=0?'+':'−'}${f(Math.abs(c.profit))} ₽</td></tr>`).join('')}</tbody></table></div></div>`;
  } else if (TAB === 'tg') {
    const sl = all.filter(x => x.m.slivL > 0), rep = STATE.maint.filter(x => x.today), toSoon = all.filter(x => x.c.toLeft <= 1500);
    const txt = [`БОРТ · Сводка за сутки (25.11)`,``,`Чистая прибыль: ${prof>=0?'+':'−'}${f(Math.abs(prof))} ₽`,`Выручка ${f(rev)} ₽ · Расходы ${f(out)} ₽`,`Выработка: ${f(trips)} рейсов · ${f(tons)} т · ${f(km)} км`,``,`Требуют внимания:`,...sl.map(x => `— Слив ДТ: ${x.m.name} (${x.m.driver}) −${x.m.slivL} л (−${f(x.c.slivRub)} ₽)`),...rep.map(l => { const car = STATE.machines.find(x => x.id === l.machineId); return `— Ремонт: ${car?car.name:l.machineId} (${f(l.odoKm)} км) · ${l.work} (${f(l.cost)} ₽)`; }),...toSoon.map(x => `— ТО: ${x.m.name} · ${x.c.toLeft<=0?`просрочка +${f(Math.abs(x.c.toLeft))} км`:`осталось ${f(x.c.toLeft)} км`}`)].join('\n');
    root.innerHTML = `<div class="tg-shell"><div style="display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)"><div class="logo-mark" style="border-radius:50%"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg></div><div><b>БОРТ · Telegram</b><div style="font-size:11.5px;color:var(--gr)">Автоотправка ежедневно в 07:00</div></div></div><div class="tg-bub num">${esc(txt)}</div>${TG_EXTRA}<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn" onclick="tgAsk('rt')">По маршрутам</button><button class="btn" onclick="tgAsk('to')">Кому на ТО?</button><button class="btn" onclick="tgAsk('sliv')">Сливы ДТ</button><button class="btn" onclick="TG_EXTRA='';render()">Очистить</button></div></div>`;
  }
}
function tgAsk(k) {
  let q='', a='';
  if (k==='rt') { q = 'Итог по маршрутам'; a = STATE.routes.map(r => { const cars = STATE.machines.filter(m => m.routeId === r.id); return `— ${r.name}: ${cars.length} борт., ${f(cars.reduce((s,m)=>s+calc(m).tons,0))} т, +${f(cars.reduce((s,m)=>s+calc(m).rev,0))} ₽`; }).join('\n'); }
  else if (k==='to') { q = 'Ближайшие ТО'; a = STATE.machines.map(m => ({ m, l: m.nextToKm - m.odoKm })).filter(x => x.l <= 3000).map(x => `— ${x.m.name} (${f(x.m.odoKm)} км): ${x.l<=0?`просрочка +${f(Math.abs(x.l))} км`:`через ${f(x.l)} км`}`).join('\n') || 'Ближайших ТО нет.'; }
  else { q = 'Сливы топлива'; a = STATE.machines.filter(m => m.slivL > 0).map(m => `— ${m.name} (${m.driver}): −${m.slivL} л (−${f(m.slivL*STATE.diesel)} ₽)`).join('\n') || 'Сливов не зафиксировано.'; }
  TG_EXTRA = `<div class="tg-q">${esc(q)}</div><div class="tg-bub num">${esc(a)}</div>`; render();
}
function exportCsv() {
  const h = 'Борт;Госномер;Водитель;Маршрут;Рейсы;Тоннаж_т;Источник;Пробег_сут_км;Одометр_км;ДТ_л;Слив_л;Чистыми_руб';
  const rows = [h].concat(STATE.machines.map(m => { const c = calc(m); return [m.name, m.plate, m.driver, c.rt.name, m.trips, c.tons, c.tonsSrc, m.dayKm, m.odoKm, c.totalFuelL, m.slivL, Math.round(c.profit)].join(';'); }));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')], { type:'text/csv;charset=utf-8' })); a.download = 'bort_svodka.csv'; a.click(); toast('Excel-файл скачан');
}
render();
</script>
